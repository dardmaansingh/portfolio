      (function(){try{var stored=window.localStorage.getItem('theme');var resolved=stored==='light'?'light':'dark';var root=document.documentElement;root.classList.remove('light','dark');root.classList.add(resolved);root.setAttribute('data-theme',resolved);root.style.colorScheme=resolved;}catch(e){}})();
